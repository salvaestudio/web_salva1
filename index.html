<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17181b">
<title>salva vivas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17181b;
    --muted:#5f6267;
    --mid:#8c9096;
    --bright:#cfd3d9;
    --orange:#e8763f;
    --line:#000;
  }

  *{ box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    margin:0;
    background:radial-gradient(120% 120% at 50% 42%, #1e1f23 0%, #161719 72%);
    color:var(--mid);
    font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight:400;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:geometricPrecision;
  }

  /* subtle CRT scanlines */
  .scanlines{
    position:fixed; inset:0; z-index:61; pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.025) 0 1px,
      transparent 1px 3px);
    mix-blend-mode:overlay;
    opacity:.6;
  }

  /* ---------- stage ---------- */
  .stage{
    position:fixed; inset:0; z-index:10;
    display:grid; place-items:center;
  }

  /* ---------- full-screen ascii field ---------- */
  .field{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center;
    overflow:hidden;
    font-size:clamp(11px, 1.1vw, 16px);
    line-height:1.6;
    user-select:none;
  }

  .row{
    position:relative;
    display:grid;
    height:1.6em;
    overflow:hidden;
  }

  /* black band, full character height, ~20 chars wide, random position */
  .bar{
    position:absolute;
    top:0; bottom:0;
    background:var(--line);
    z-index:0;
  }

  .cell{
    position:relative;
    z-index:1;
    text-align:center;
    line-height:1.6;
    color:var(--mid);
    transition:color .15s ease;
  }
  .cell.orange{ color:var(--orange); }
  .cell.bright{ color:var(--bright); }

  /* the slash spins only near the cursor */
  .cell.spin{ cursor:crosshair; will-change:contents; }
  .cell.spin:hover{
    color:#fff;
    text-shadow:0 0 10px rgba(232,118,63,.7);
  }

  /* ---------- centered p5 sketch ---------- */
  .center{
    position:relative;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }

  #sketch{ display:block; }
  #sketch canvas{ display:block; }
</style>
</head>
<body>
  <main class="stage">
    <div id="field" class="field" aria-hidden="true"></div>

    <div class="center">
      <div id="sketch" aria-label="Globo terráqueo de puntos girando"></div>
    </div>
  </main>

  <div class="scanlines" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<script>
(function () {
  const field = document.getElementById("field");
  const FRAMES = ["/", "-", "\\", "|"];
  const BAR_CHARS = 20;
  const RADIUS = 5;
  const BASE_INTERVAL = 68;

  let grid = [];
  let cellW = 1;
  let cellH = 1;

  const active = new Map();
  let last = 0;

  function makeCell() {
    const cell = document.createElement("span");
    cell.className = "cell spin";
    cell.textContent = FRAMES[0];

    const r = Math.random();
    if (r < 0.07) cell.classList.add("orange");
    else if (r < 0.16) cell.classList.add("bright");

    return cell;
  }

  function buildRow(cols) {
    const row = document.createElement("div");
    row.className = "row";
    row.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";

    if (cols > BAR_CHARS + 2 && Math.random() < 0.28) {
      const maxStart = cols - BAR_CHARS;
      const start = Math.floor(Math.random() * (maxStart + 1));
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.style.left = (start / cols * 100) + "%";
      bar.style.width = (BAR_CHARS / cols * 100) + "%";
      row.appendChild(bar);
    }

    const cellRow = [];
    for (let c = 0; c < cols; c++) {
      const cell = makeCell();
      cellRow.push(cell);
      row.appendChild(cell);
    }
    grid.push(cellRow);
    return row;
  }

  function clearActive() {
    for (const cell of active.keys()) cell.textContent = FRAMES[0];
    active.clear();
  }

  function render() {
    field.innerHTML = "";
    clearActive();
    grid = [];

    const cs = getComputedStyle(field);
    const fs = parseFloat(cs.fontSize) || 14;
    const lh = parseFloat(cs.lineHeight) || fs * 1.6;
    const cols = Math.max(8, Math.round(field.clientWidth / (fs * 1.35)));
    const rows = Math.max(6, Math.round(field.clientHeight / lh));

    cellW = field.clientWidth / cols;
    cellH = lh;

    const frag = document.createDocumentFragment();
    for (let r = 0; r < rows; r++) frag.appendChild(buildRow(cols));
    field.appendChild(frag);
  }

  function speedFor(distance) {
    return BASE_INTERVAL + Math.pow(distance, 1.5) * 34;
  }

  function updateFromPointer(px, py) {
    const col = Math.floor(px / cellW);
    const row = Math.floor(py / cellH);
    const next = new Set();

    for (let dr = -RADIUS; dr <= RADIUS; dr++) {
      const rr = row + dr;
      if (rr < 0 || rr >= grid.length) continue;

      for (let dc = -RADIUS; dc <= RADIUS; dc++) {
        const cc = col + dc;
        if (cc < 0 || cc >= grid[rr].length) continue;

        const dist = Math.sqrt(dc * dc + dr * dr);
        if (dist > RADIUS) continue;

        const cell = grid[rr][cc];
        next.add(cell);

        let st = active.get(cell);
        if (!st) {
          st = { interval: speedFor(dist), phase: 0 };
          active.set(cell, st);
        } else {
          st.interval = speedFor(dist);
        }
      }
    }

    for (const cell of active.keys()) {
      if (!next.has(cell)) {
        if (cell.textContent !== FRAMES[0]) cell.textContent = FRAMES[0];
        active.delete(cell);
      }
    }
  }

  function tick(now) {
    const dt = last ? now - last : 0;
    last = now;

    for (const [cell, st] of active) {
      st.phase += dt / st.interval;
      const frame = FRAMES[Math.floor(st.phase) % FRAMES.length];
      if (cell.textContent !== frame) cell.textContent = frame;
    }

    requestAnimationFrame(tick);
  }

  field.addEventListener("pointermove", function (e) {
    const rect = field.getBoundingClientRect();
    updateFromPointer(e.clientX - rect.left, e.clientY - rect.top);
  });

  field.addEventListener("pointerleave", clearActive);

  render();
  last = performance.now();
  requestAnimationFrame(tick);

  let resizeRaf = null;
  window.addEventListener("resize", function () {
    if (resizeRaf) cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(render);
  });
})();
</script>
<script>
  const NUM_FRAMES = 200;
  const LOGICAL = 400;
  const IMAGENES = [];
  let currentFrame = 0;

  function canvasSize() {
    const m = Math.min(window.innerWidth, window.innerHeight);
    return Math.max(240, Math.min(640, Math.round(m * 0.72)));
  }

  function preload() {
    for (let i = 1; i <= NUM_FRAMES; i++) {
      IMAGENES.push(loadImage("frames/frame" + nf(i, 4) + ".png"));
    }
  }

  function setup() {
    const c = createCanvas(canvasSize(), canvasSize());
    c.parent("sketch");
    pixelDensity(Math.min(window.devicePixelRatio || 1, 2));
    frameRate(25);
    textFont("IBM Plex Mono");
  }

  function windowResized() {
    resizeCanvas(canvasSize(), canvasSize());
  }

  function draw() {
    clear();

    const s = width / LOGICAL;
    push();
    scale(s);

    // ---- rotating line grid (background) ----
    const w = LOGICAL * 0.10;
    const h = LOGICAL * 0.10;
    const off = LOGICAL * 0.05;

    for (let i = 0; i <= 10; i++) {
      for (let j = 0; j <= 10; j++) {
        const x = off + w * i;
        const y = off + h * j;
        push();
        translate(x, y);
        rotate(frameCount * 0.2 + j + i);
        strokeWeight(0.5);
        stroke(232, 118, 63, 80);
        line(-5, -5, 5, 5);
        pop();
      }
    }

    // ---- pulsing rings ----
    const u = 230 + sin(frameCount * 0.09) * 40;
    const v = 240 + sin(frameCount * 0.04) * 40;

    fill(232, 118, 63, 12);
    stroke(232, 118, 63, 55);
    strokeWeight(0.7);
    circle(200, 200, v + 114);

    fill(207, 211, 217, 8);
    stroke(207, 211, 217, 32);
    strokeWeight(0.7);
    circle(200, 200, u + 90);

    // ---- orbiting dots ----
    noStroke();
    const radius = 130;
    let ancho = 6;

    for (let c = 1; c <= 12; c++) {
      const a = radians(frameCount * 0.903 * c);
      const x = 200 + radius * cos(a);
      const y = 200 + radius * sin(a);
      fill(232, 118, 63, 235);
      circle(x, y, ancho);
      ancho = random(6, 12);
    }

    // ---- planet body ----
    noStroke();
    fill(32, 34, 40);
    circle(200, 200, 220);

    noFill();
    stroke(207, 211, 217, 30);
    strokeWeight(0.8);
    circle(200, 200, 220);

    // ---- latin text + pi ----
    const plain = "Dies vertendo";
    const accent = "transigimus";
    const spacer = " ";

    textSize(14);
    textAlign(LEFT);

    const fullW = textWidth(plain + spacer + accent);
    const textX = 200 - fullW / 2;

    stroke(15, 16, 20, 220);
    strokeWeight(2.2);

    fill(207, 211, 217, 210);
    text(plain, textX, 203);

    fill(232, 118, 63, 240);
    text(accent, textX + textWidth(plain + spacer), 203);

    textAlign(CENTER);
    noStroke();
    fill(232, 118, 63, 235);
    textSize(30);
    text("π", 200, 370);
    text("π", 200, 48);

    // ---- rotating earth frames ----
    image(IMAGENES[currentFrame], 0, 0, 400, 400);
    currentFrame = (currentFrame + 1) % NUM_FRAMES;

    pop();
  }
</script>
</body>
</html>
